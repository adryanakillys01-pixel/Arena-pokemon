<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Arena Pokémon RPG</title><style>
*{box-sizing:border-box}body{margin:0;background:#080f1b;color:#e8f1ff;font:15px system-ui,sans-serif;overscroll-behavior:none}main{max-width:1000px;margin:auto;padding:12px}button,input{font:inherit}button{border:1px solid #486d91;background:#203a55;border-radius:12px;padding:12px;color:white;font-weight:750;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4}button.primary{background:#f5c64c;color:#142135;border:0}input{width:100%;background:#0e1b30;border:1px solid #48617d;color:white;padding:12px;border-radius:10px;margin:8px 0}a{color:#9bd7ff}header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}header b{color:#f5cf68;letter-spacing:1px}small,.muted{color:#a7b8ce}h1,h2{margin:8px 0}.panel{background:#112338;border:1px solid #314c6c;padding:16px;border-radius:15px;margin:10px 0}.full{width:100%;margin-top:8px}.hero{padding:25px 10px;text-align:center;background:radial-gradient(ellipse at bottom,#24537a,#132237);border-radius:12px}.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:7px;max-height:45vh;overflow:auto}.catalog button{padding:5px;overflow-wrap:anywhere;min-height:90px}.catalog img{width:56px;height:56px;object-fit:contain;display:block;margin:auto}.nav{display:flex;align-items:center;justify-content:space-between;margin-top:10px}.selected{outline:2px solid #ffd366}.battle{display:grid;gap:8px}.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}.hudcard{background:#142a43;border:1px solid #3a6a9c;border-radius:10px;padding:8px;min-width:0}.hudcard.enemy{background:#39232d;border-color:#ac6570}.hudcard b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar{height:8px;background:#081222;border-radius:8px;overflow:hidden;margin:4px 0}.bar i{display:block;height:100%;background:#4cdb83;transition:width .15s}.bar.energy i{background:#54c6ff}.clock{text-align:center;font-weight:800;color:#f6ce6d;min-width:46px}.canvaswrap{position:relative;border:1px solid #526b7f;border-radius:13px;overflow:hidden;background:#293d34}canvas{width:100%;aspect-ratio:12/7;display:block;touch-action:none}.battlelog{position:absolute;left:7px;bottom:7px;right:7px;background:#071221c9;padding:6px 9px;border-radius:7px;color:#f8e1a4;font-size:11px;pointer-events:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.controls{display:grid;grid-template-columns:118px 1fr;align-items:center;gap:10px;user-select:none;-webkit-user-select:none}.joystick{width:112px;height:112px;border-radius:50%;background:radial-gradient(#243e56,#12263b);border:2px solid #536e8c;position:relative;touch-action:none;margin:auto}.stick{width:49px;height:49px;position:absolute;left:50%;top:50%;margin:-24.5px;border-radius:50%;background:radial-gradient(at 35% 30%,#9bd5f4,#33739d);border:2px solid #a6d5ec;pointer-events:none;box-shadow:0 4px 10px #0006}.skills{display:grid;grid-template-columns:1fr 1fr;gap:5px}.skills button{position:relative;min-height:53px;padding:5px;font-size:11px;overflow:hidden;touch-action:none}.skills button span{display:block;font-size:10px;opacity:.8}.skills button.ready{box-shadow:inset 0 -3px 0 #ffffff30}.skills button.wait{filter:saturate(.5);opacity:.65}.dodge{grid-column:1/-1;background:#344e78;padding:8px!important}.toolbar{display:flex;justify-content:space-between;align-items:center;font-size:12px;gap:6px}.toolbar button{font-size:11px;padding:6px 9px}.error{color:#ffad9d;min-height:0}.result{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#091321df;z-index:5;padding:15px}.result h2{color:#ffe099;font-size:26px}.hidden{display:none!important}.hint{font-size:12px;color:#a9c5df;text-align:center}.pickdetail{padding:8px 0}.code{font-size:34px;color:#f5cf68;letter-spacing:6px;font-weight:900}.loading{padding:24px;text-align:center}@media(min-width:720px){.controls{grid-template-columns:160px 1fr;max-width:620px;margin:auto;width:100%}.joystick{width:140px;height:140px}.skills button{font-size:14px;min-height:58px}}@media(max-height:500px) and (orientation:landscape){main{max-width:none;padding:5px}.battle{grid-template-columns:1fr 230px;gap:5px}.hud,.toolbar{grid-column:1/-1}.controls{grid-template-columns:100px 1fr}.canvaswrap canvas{max-height:55vh;object-fit:contain}.joystick{width:96px;height:96px}.hint,header small{display:none}}
</style></head><body><main><header><div><b>⚔ ARENA RPG</b><br><small>Combate de ação · 1 contra 1</small></div><a href="/index.html">Modo por turnos</a></header><div id="error" class="error"></div><div id="app"><div class="loading">Carregando Pokédex…</div></div></main><script>
let dex={},moves={},state=null,session=null,busy=false,net=false,seq=Date.now(),selected='',query='',page=0,layout='',dx=0,dy=0,pendingSkill=null,pendingDash=false,stickPointer=null,lastSend=0,lastReceive=0,drawPositions={},canvas=null,ctx=null;
const app=document.getElementById('app'),err=document.getElementById('error'),keys=new Set(),imgs=new Map(),colors={Fogo:'#f66e48',Água:'#52a8ff',Planta:'#76d85a',Elétrico:'#ffe14c',Gelo:'#a3e9ff',Terra:'#b98d5a',Pedra:'#c2ad70',Psíquico:'#e787d6',Fantasma:'#aa8aff',Sombrio:'#776681',Normal:'#cbd4de',Fada:'#ff9fd5',Veneno:'#b681e4',Aço:'#9caebb',Voador:'#8dc7f1',Lutador:'#e28f6e',Dragão:'#8989ff',Inseto:'#a7bd4a'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sprite=id=>'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/'+id+'.png';
function image(id){if(!imgs.has(id)){let im=new Image();im.src=sprite(id);imgs.set(id,im)}return imgs.get(id)}
try{session=JSON.parse(localStorage.getItem('arenaRpgSession')||'null')}catch{}
async function api(op,extra={}){let response=await fetch('/rpg-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op,...session,...extra})});let data=await response.json();if(!response.ok)throw Error(data.error||'Erro de conexão');return data}
function accept(data){if(data.token){session={code:data.state.code,token:data.token};localStorage.setItem('arenaRpgSession',JSON.stringify(session));seq=Date.now()}state=data.state;lastReceive=performance.now();err.textContent='';render()}
async function command(op,extra={}){if(busy)return;busy=true;try{accept(await api(op,extra))}catch(e){err.textContent=e.message}finally{busy=false}}
function reset(){session=null;state=null;layout='';selected='';dx=dy=0;pendingDash=false;pendingSkill=null;localStorage.removeItem('arenaRpgSession');render()}
function catalog(){const node=document.getElementById('list');if(!node)return;let q=query.toLowerCase().trim();let items=Object.values(dex).filter(p=>!q||p.name.toLowerCase().includes(q)||p.types.join(' ').toLowerCase().includes(q)||String(p.id)===q).sort((a,b)=>a.id-b.id);let pages=Math.max(1,Math.ceil(items.length/36));page=Math.max(0,Math.min(page,pages-1));node.innerHTML=items.slice(page*36,(page+1)*36).map(p=>'<button data-pick="'+esc(p.name)+'" class="'+(selected===p.name?'selected':'')+'"><img loading="lazy" src="'+sprite(p.id)+'" onerror="this.style.visibility=\'hidden\'" alt=""><b>'+esc(p.name)+'</b><br><small>'+esc(p.types.join('/'))+'</small></button>').join('')||'<p>Nenhum resultado.</p>';document.getElementById('page').textContent=(page+1)+' / '+pages+' · '+items.length;const p=dex[selected];document.getElementById('pickdetail').textContent=p?p.name+' · HP '+p.stats[0]+' · Velocidade '+p.stats[5]+' · '+p.moves.join(', '):'Selecione um Pokémon';document.getElementById('confirm').disabled=!p}
function render(force=false){const phase=state?.phase||'home',next=phase+(phase==='select'&&state.players[state.you].picked?'-ready':'');if(next===layout&&!force){if(phase==='fight'||phase==='end')hud();return}layout=next;canvas=null;ctx=null;drawPositions={};
if(phase==='home'){app.innerHTML='<div class="panel"><div class="hero"><small>NOVO MODO</small><h1>Controle seu Pokémon</h1><p>Movimente, ataque, desvie. Vence quem dominar a arena!</p></div><input id="name" maxlength="24" placeholder="Nome do treinador"><button class="primary full" data-op="create">⚔ Criar sala RPG</button><button class="full" data-op="solo">🤖 Treinar contra CPU</button><p class="muted">Entrar na sala de um amigo</p><input id="code" maxlength="6" placeholder="Código" value="'+esc(new URLSearchParams(location.search).get('room')||'')+'"><button class="full" data-op="join">Entrar</button></div>';return}
if(phase==='lobby'){app.innerHTML='<div class="panel" style="text-align:center"><small>Compartilhe o código</small><div class="code">'+esc(state.code)+'</div><button data-op="invite">Compartilhar convite</button><p>Aguardando outro treinador…</p><button data-op="leave">Voltar</button></div>';return}
if(phase==='select'){if(state.players[state.you].picked){app.innerHTML='<div class="panel"><h2>Pokémon confirmado!</h2><p>Aguardando o adversário…</p><button data-op="leave">Voltar</button></div>';return}selected='';app.innerHTML='<div class="panel"><h2>Escolha seu Pokémon</h2><small>Combate de ação 1 × 1. Pokémon aleatórios são sorteados entre espécies não lendárias de força intermediária.</small><button class="full" data-op="random">🎲 Sortear Pokémon</button><input id="search" placeholder="Buscar por nome, tipo ou número" value="'+esc(query)+'"><div id="list" class="catalog"></div><div class="nav"><button data-op="prev">‹</button><small id="page"></small><button data-op="next">›</button></div><div id="pickdetail" class="pickdetail"></div><button id="confirm" data-op="pick" class="primary full">Confirmar Pokémon</button><button class="full" data-op="leave">Voltar</button></div>';document.getElementById('search').oninput=e=>{query=e.target.value;page=0;catalog()};catalog();return}
app.innerHTML='<div class="battle"><div class="hud" id="hud"></div><div class="canvaswrap"><canvas id="field" width="960" height="560"></canvas><div id="log" class="battlelog">Lute!</div><div id="result" class="result hidden"></div></div><div class="controls"><div id="joystick" class="joystick"><div id="stick" class="stick"></div></div><div id="skills" class="skills"></div></div><div class="toolbar"><small id="net">Conectando…</small><button data-op="forfeit">Desistir</button><button data-op="leave">Sair</button></div><div class="hint">Joystick ou WASD/setas · Golpes 1–4 · Espaço para esquivar. Físicos precisam de proximidade; especiais lançam projéteis.</div></div>';canvas=document.getElementById('field');ctx=canvas.getContext('2d');bindStick();buildSkills();hud()}
function buildSkills(){const p=state.players[state.you].p;document.getElementById('skills').innerHTML=p.skills.map((n,i)=>'<button data-skill="'+i+'" style="background:'+(colors[moves[n].type]||'#7792aa')+';color:#101827"><b>'+esc(n)+'</b><span id="cd'+i+'"></span></button>').join('')+'<button data-op="dash" id="dash" class="dodge">⚡ ESQUIVAR</button>'}
function hud(){if(!state||!document.getElementById('hud'))return;let a=state.players[state.you],b=state.players[1-state.you];const card=(p,enemy)=>'<div class="hudcard '+(enemy?'enemy':'')+'"><small>'+esc(p.name)+'</small><b>'+esc(p.p.name)+'</b><div class="bar"><i style="width:'+(100*p.p.hp/p.p.maxHp)+'%;background:'+(p.p.hp/p.p.maxHp<.25?'#f27265':'#4cdb83')+'"></i></div><small>'+p.p.hp+'/'+p.p.maxHp+' HP '+esc(p.p.status||'')+'</small><div class="bar energy"><i style="width:'+p.p.energy+'%"></i></div></div>';document.getElementById('hud').innerHTML=card(a,false)+'<div class="clock">'+Math.ceil(state.remaining)+'s<br><small>'+state.score[state.you]+' : '+state.score[1-state.you]+'</small></div>'+card(b,true);document.getElementById('log').textContent=state.events.at(-1)?.text||'Lute!';a.p.cd.forEach((v,i)=>{let el=document.getElementById('cd'+i),btn=el?.parentElement;if(!el)return;el.textContent=v>.05?v.toFixed(1)+' s':a.p.energy<20?'Sem energia':moves[a.p.skills[i]].cat==='F'?'Corpo a corpo':'Pronto';btn.classList.toggle('wait',v>.05||a.p.energy<20);btn.classList.toggle('ready',v<=.05&&a.p.energy>=20)});const dash=document.getElementById('dash');dash.style.opacity=a.p.energy<27?.45:1;document.getElementById('net').textContent=performance.now()-lastReceive<1500?'● Conectado':'◷ Reconectando';if(state.phase==='end'){let r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML='<h2>'+(state.winner===-1?'Empate!':state.winner===state.you?'🏆 Você venceu!':'Derrota')+'</h2><p>Placar '+state.score[state.you]+' × '+state.score[1-state.you]+'</p><button class="primary" data-op="rematch">'+(state.rematch[state.you]?'Aguardando rival…':'Revanche')+'</button><button style="margin-top:8px" data-op="leave">Voltar ao início</button>'}}
function bindStick(){const j=document.getElementById('joystick'),k=document.getElementById('stick');function move(e){let r=j.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/(r.width*.32),y=(e.clientY-r.top-r.height/2)/(r.height*.32),n=Math.max(1,Math.hypot(x,y));dx=x/n;dy=y/n;k.style.transform='translate('+dx*r.width*.32+'px,'+dy*r.height*.32+'px)'}j.onpointerdown=e=>{if(stickPointer!==null)return;stickPointer=e.pointerId;j.setPointerCapture(e.pointerId);move(e)};j.onpointermove=e=>{if(e.pointerId===stickPointer)move(e)};const stop=e=>{if(e.pointerId!==stickPointer)return;stickPointer=null;dx=dy=0;k.style.transform=''};j.onpointerup=stop;j.onpointercancel=stop;j.onlostpointercapture=stop}
function field(){if(!canvas||!ctx||!state?.players?.[0]?.p)return;const c=ctx,w=960,h=560;c.clearRect(0,0,w,h);const grad=c.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#426f4e');grad.addColorStop(1,'#223b39');c.fillStyle=grad;c.fillRect(0,0,w,h);c.strokeStyle='#b8d69c20';c.lineWidth=1;for(let x=0;x<w;x+=60){c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke()}for(let y=0;y<h;y+=60){c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}c.strokeStyle='#e5edbb88';c.lineWidth=4;c.strokeRect(18,18,w-36,h-36);c.beginPath();c.moveTo(w/2,18);c.lineTo(w/2,h-18);c.stroke();c.beginPath();c.arc(w/2,h/2,95,0,Math.PI*2);c.stroke();
for(let i=0;i<2;i++){let p=state.players[i].p,pos=drawPositions[i]||(drawPositions[i]={x:p.x,y:p.y});pos.x+=(p.x-pos.x)*.26;pos.y+=(p.y-pos.y)*.26;let x=pos.x,y=pos.y;const own=i===state.you;let color=own?'#69ccff':'#ff887e';c.save();c.translate(x,y);c.fillStyle='#0005';c.beginPath();c.ellipse(0,19,38,16,0,0,Math.PI*2);c.fill();c.strokeStyle=color;c.lineWidth=3;c.beginPath();c.ellipse(0,21,39,17,0,0,Math.PI*2);c.stroke();if(own){c.strokeStyle='#ffffff30';c.setLineDash([6,7]);c.beginPath();c.arc(0,0,155,0,Math.PI*2);c.stroke();c.setLineDash([])}if(p.dash>0||p.shield>0){c.strokeStyle='#b7f7ff';c.lineWidth=4;c.beginPath();c.arc(0,0,49,0,Math.PI*2);c.stroke()}if(p.attackFlash>0){c.strokeStyle='#ffe08e';c.lineWidth=5;c.beginPath();c.arc(0,0,55+p.attackFlash*120,0,Math.PI*2);c.stroke()}let im=image(p.id);c.globalAlpha=p.hp<=0?.25:1;if(p.hitFlash>0)c.filter='brightness(1.65)';if(im.complete&&im.naturalWidth){let sz=99,ratio=im.naturalWidth/im.naturalHeight;let iw=ratio>=1?sz:sz*ratio,ih=ratio>=1?sz/ratio:sz;c.drawImage(im,-iw/2,-ih/2-15,iw,ih)}else{c.fillStyle=color;c.beginPath();c.arc(0,-8,25,0,Math.PI*2);c.fill();c.fillStyle='#14243a';c.font='bold 14px sans-serif';c.textAlign='center';c.fillText(p.name.slice(0,8),0,-3)}c.filter='none';c.globalAlpha=1;c.fillStyle='#0b1728';c.fillRect(-35,-70,70,8);c.fillStyle=color;c.fillRect(-35,-70,70*p.hp/p.maxHp,8);c.fillStyle='#fff';c.font='bold 13px sans-serif';c.textAlign='center';c.fillText(p.name,0,-76);c.restore()}
for(let p of state.projectiles){c.save();c.fillStyle=colors[p.type]||'#fff';c.shadowColor=c.fillStyle;c.shadowBlur=18;c.beginPath();c.arc(p.x,p.y,12,0,Math.PI*2);c.fill();c.restore()}}
function loop(){field();requestAnimationFrame(loop)}requestAnimationFrame(loop);
async function sync(){if(!session||busy||net)return;let phase=state?.phase;let now=performance.now();if(now-lastSend<(phase==='fight'?100:850))return;lastSend=now;net=true;let old=session;try{let extra={};if(phase==='fight'){let kx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),ky=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);extra={dx:stickPointer===null?kx:dx,dy:stickPointer===null?ky:dy,seq:++seq,dash:pendingDash,skill:pendingSkill};pendingDash=false;pendingSkill=null}let data=await api(phase==='fight'?'input':'state',extra);if(session===old&&!busy)accept(data)}catch(e){if(session===old){err.textContent=e.message;if(/Sala não encontrada|Sessão inválida/.test(e.message)){reset();err.textContent='A sala anterior expirou. Crie outra.'}}}finally{net=false}}setInterval(sync,60);
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(state?.phase!=='fight')return;if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' ','1','2','3','4'].includes(k))e.preventDefault();keys.add(k);if(e.repeat)return;if(k===' ')pendingDash=true;else if('1234'.includes(k)&&k.length===1)pendingSkill=Number(k)-1});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();dx=dy=0;stickPointer=null});
app.addEventListener('pointerdown',e=>{const b=e.target.closest('button[data-skill],button[data-op="dash"]');if(!b||state?.phase!=='fight')return;e.preventDefault();if(b.dataset.skill!==undefined)pendingSkill=Number(b.dataset.skill);else pendingDash=true});
app.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.pick!==undefined){selected=b.dataset.pick;catalog();return}const op=b.dataset.op;if(['create','solo','join'].includes(op))return command(op,{name:document.getElementById('name').value,code:document.getElementById('code').value});if(op==='prev'||op==='next'){page+=op==='prev'?-1:1;catalog();return}if(op==='pick')return command('pick',{pokemon:selected});if(op==='random')return command('random');if(op==='invite'){let u=new URL(location.origin+'/rpg');u.searchParams.set('room',state.code);try{if(navigator.share)await navigator.share({title:'Arena Pokémon RPG',url:u.href});else await navigator.clipboard.writeText(u.href)}catch{err.textContent='Código: '+state.code}return}if(op==='forfeit'&&confirm('Desistir da partida?'))return command('forfeit');if(op==='rematch')return command('rematch');if(op==='leave'){if(state?.phase==='fight'&&!confirm('Sair da sala?'))return;reset()}});
(async()=>{try{let data=await(await fetch('/dex')).json();dex=data.dex;moves=data.moves;if(session){try{accept(await api('state'))}catch{reset()}}else render()}catch(e){err.textContent='Não foi possível carregar a Pokédex.'}})();
</script></body></html>
