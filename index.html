<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Arena Pokémon</title><style>
*{box-sizing:border-box}body{margin:0;background:#081321;color:#edf5ff;font:15px system-ui,sans-serif}main{max-width:920px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}.brand{font-weight:950;font-size:23px;letter-spacing:-.8px}.muted,small{color:#a9bfd5}button,input,select{font:inherit}button{border:1px solid #52779f;background:#173451;color:#fff;font-weight:750;border-radius:12px;padding:12px;cursor:pointer}button:hover{filter:brightness(1.2)}button:disabled{opacity:.45;cursor:default}button.primary{background:#e8b63c;color:#172136;border:0}input,select{width:100%;color:white;background:#0d2035;border:1px solid #44617e;border-radius:10px;padding:12px;margin:6px 0 12px}label{font-size:13px;color:#c8dbed}.panel{background:#10243a;border:1px solid #294663;border-radius:16px;padding:16px;margin:12px 0}.line{display:flex;gap:8px;align-items:center;justify-content:space-between}.line>*{min-width:0}.center{text-align:center}.score{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;text-align:center;align-items:center;background:#132943;border-radius:13px;padding:10px}.score strong{font-size:24px}.blue{color:#7ecbff}.red{color:#ffa097}.arena{position:relative;overflow:hidden;border:1px solid #426b85;border-radius:18px;background:linear-gradient(#63b8ec 0%,#bce7f5 43%,#6eaa65 44%,#7cb46d 54%,#c6a17a 55%,#d6b491 100%);min-height:270px;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;isolation:isolate}.arena:before{content:'';position:absolute;z-index:-1;left:8%;right:8%;bottom:16%;height:35%;border:3px solid #fff5d8aa;border-radius:50%;background:#9e785333;transform:perspective(300px) rotateX(20deg)}.fighter{display:flex;flex-direction:column;justify-content:space-between;align-items:center;min-width:0}.plate{width:100%;background:#0a2036ed;border:1px solid #6fbeee;border-radius:12px;padding:9px;box-shadow:0 4px 14px #0003}.enemy .plate{border-color:#f38a7d}.plate strong{font-size:17px}.bar{height:9px;background:#263e53;border-radius:20px;overflow:hidden;margin:5px 0}.bar i{display:block;height:100%;border-radius:20px;transition:width .4s}.sprite{width:min(100%,190px);height:150px;object-fit:contain;filter:drop-shadow(0 9px 4px #34220a55);image-rendering:auto}.enemy .sprite{transform:scaleX(-1)}.sprite-fallback{font-size:68px;margin:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.move{min-height:72px;text-align:left;border-color:#ffffff35}.move small{display:block;color:#fff;opacity:.85;font-weight:500;font-size:12px;margin-top:5px}.team{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.member{padding:8px;text-align:center;overflow-wrap:anywhere}.member img{height:54px;width:54px;object-fit:contain;display:block;margin:auto}.member small{display:block}.selected{outline:2px solid #efc04e}.log{max-height:180px;overflow:auto;font-size:13px;line-height:1.6;color:#d5e8ff}.log div{border-bottom:1px solid #29415a;padding:3px 0}.error{color:#ffaaa2;margin:8px 0}.tag{display:inline-block;background:#25394e;border-radius:7px;padding:3px 7px;font-size:11px;margin-top:3px}.waiting{padding:14px;text-align:center;color:#eac76d;background:#202e3e;border-radius:10px}.catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:7px;max-height:350px;overflow:auto}.catalog button{padding:6px;min-height:90px}.catalog img{display:block;width:56px;height:56px;object-fit:contain;margin:auto}.catalog small{display:block;font-size:11px}.slot{border:1px dashed #53738e;min-height:52px;padding:8px;border-radius:8px;font-size:13px}.hidden{display:none}.footer{font-size:11px;color:#a9bfd5;text-align:center;margin:18px}.badge{font-size:12px;color:#f6cc72}.full{width:100%}@media(min-width:640px){.arena{min-height:350px}.sprite{height:220px}.actions{grid-template-columns:repeat(4,1fr)}}
</style></head><body><main><header><div><div class="brand">⚔ ARENA POKÉMON</div><small>Liga de treinadores · multiplayer</small></div><button id="exit" class="hidden">Sair</button></header><div id="error" class="error" role="alert"></div><div id="app"></div><div class="footer">Projeto de fã não oficial · Combate simplificado · Nível 50</div></main><script>
let dex={},moves={},session=JSON.parse(localStorage.getItem('arenaSession')||'null'),state=null,chosen=[],busy=false,lastRender='',timer=null,speciesCount=0,catalogQuery='',catalogGen='',catalogForms='all',catalogPage=0;
const PAGE_SIZE=48;
const app=document.getElementById('app'),error=document.getElementById('error');
const colors={'Fogo':'#9c3927','Água':'#155d99','Planta':'#297a47','Terra':'#815733','Normal':'#4c6072','Fada':'#a64d85','Veneno':'#73439a','Elétrico':'#8b6916','Gelo':'#267e91','Psíquico':'#934776','Fantasma':'#60428f','Sombrio':'#3c384d','Pedra':'#77674a','Lutador':'#984b36','Aço':'#506777','Voador':'#535f9b','Dragão':'#5441a3','Inseto':'#577d30'};
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const image=(p,cls='')=>`<img loading="${cls==='sprite'?'eager':'lazy'}" decoding="async" class="${cls}" alt="${esc(p.name)}" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.id}.png" onerror="this.outerHTML='<span class=\'sprite-fallback\'>◈</span>'">`;
async function api(op,extra={}){const response=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op,...session,...extra})});const data=await response.json();if(!response.ok)throw Error(data.error||'Falha de conexão');return data;}
async function command(op,extra={}){if(busy)return;busy=true;error.textContent='';try{const data=await api(op,extra);if(data.token){session={code:data.state.code,token:data.token};localStorage.setItem('arenaSession',JSON.stringify(session));}state=data.state;if(state.phase!=='teams')chosen=[];render(true);}catch(e){error.textContent=e.message;}finally{busy=false;}}
async function poll(){if(!session||busy)return;try{const prev=session, data=await api('state');if(busy||session!==prev)return;state=data.state;error.textContent='';render();}catch(e){error.textContent=e.message;}}
function bar(p){const pc=100*p.hp/p.stats[0];return `<div class="bar"><i style="width:${pc}%;background:${pc>50?'#40d37b':pc>25?'#f1ba42':'#f15b5b'}"></i></div><small>${p.hp}/${p.stats[0]} HP</small>`;}
function teamCard(p,j,on,action){return `<button class="member ${on?'selected':''}" ${action?'':'disabled'} data-do="${action||''}" data-i="${j}">${image(p)}<b>${esc(p.name)}</b>${bar(p)}${p.status?`<small>${esc(p.status)}</small>`:''}</button>`;}
function score(){return `<div class="score"><div class="blue">${esc(state.players[0].name)}<br><strong>${state.score[0]}</strong></div><div><small>SALA ${esc(state.code)}</small><br>VS</div><div class="red">${esc(state.players[1]?.name||'Aguardando')}<br><strong>${state.score[1]}</strong></div></div>`;}
function plate(p,side){const labels=['ATQ','DEF','ATQ ESP','DEF ESP','VEL','PREC'];return `<div class="fighter ${side}"><div class="plate"><div class="line"><strong>${esc(p.name)}</strong><small>Nv.50</small></div><small>${esc(p.types.join(' / '))}</small>${bar(p)}<div>${p.status?`<span class="tag">${esc(p.status)}</span>`:''}${p.st.map((v,i)=>v?`<span class="tag">${labels[i]} ${v>0?'+':''}${v}</span>`:'').join('')}</div></div>${image(p,'sprite')}</div>`;}
function renderCatalog(){
  const list=document.getElementById('catalog'),nav=document.getElementById('catalogNav');
  if(!list||!nav)return;
  const norm=x=>String(x??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const q=norm(catalogQuery.trim());
  const entries=Object.values(dex).filter(p=>(!catalogGen||String(p.generation)===catalogGen)&&(catalogForms==='all'||p.default!==false)&&(norm(p.name).includes(q)||String(p.id)===q||norm(p.types.join(' ')).includes(q))).sort((a,b)=>a.id-b.id);
  const pages=Math.max(1,Math.ceil(entries.length/PAGE_SIZE));catalogPage=Math.max(0,Math.min(catalogPage,pages-1));
  list.innerHTML=entries.slice(catalogPage*PAGE_SIZE,(catalogPage+1)*PAGE_SIZE).map(p=>`<button class="${chosen.includes(p.name)?'selected':''}" data-do="pick" data-n="${esc(p.name)}">${image(p)}${esc(p.name)}<small>#${p.id} · ${esc(p.types.join('/'))}</small></button>`).join('')||'<p>Nenhum Pokémon encontrado.</p>';
  nav.innerHTML=`<div class="line"><button data-do="prev" ${catalogPage===0?'disabled':''}>‹ Anterior</button><small>${catalogPage+1}/${pages} · ${entries.length} resultados</small><button data-do="next" ${catalogPage+1>=pages?'disabled':''}>Próxima ›</button></div>`;
}
function render(force=false){const key=JSON.stringify(state);if(!force&&key===lastRender)return;lastRender=key;document.getElementById('exit').classList.toggle('hidden',!session);if(!session||!state){app.innerHTML=`<div class="panel center"><h1>Entre na arena</h1><p class="muted">Cada treinador joga pelo próprio celular.</p><label>Seu nome<input id="name" maxlength="24" placeholder="Nome do treinador"></label><button class="primary full" data-do="create">Criar sala</button><p>ou entre com um código</p><input id="code" maxlength="6" placeholder="Código da sala" autocapitalize="characters"><button class="full" data-do="join">Entrar na sala</button></div>`;return;}
const me=state.players[state.you],other=state.players[1-state.you];let html=score();
if(state.phase==='lobby'){html+=`<div class="panel center"><small>ENVIE ESTE CÓDIGO AO ADVERSÁRIO</small><h1 style="letter-spacing:5px">${esc(state.code)}</h1><button data-do="copy">Copiar código</button><p class="waiting">Aguardando segundo treinador…</p></div>`;}
else if(state.phase==='teams'){html+=`<div class="panel"><h2>Monte sua equipe</h2><p class="muted">Escolha 3 Pokémon. O primeiro será seu inicial. A equipe fica oculta até ambos confirmarem.</p>`;if(me.selected){html+=`<p class="waiting">Equipe confirmada. Aguardando ${esc(other.name)}.</p><div class="team">${me.team.map((p,j)=>teamCard(p,j,j===0,'')).join('')}</div>`;}else{html+=`<div class="team">${[0,1,2].map(j=>`<div class="slot">${j===0?'Inicial':`Reserva ${j}`}<br><b>${esc(chosen[j]||'—')}</b></div>`).join('')}</div><p><button class="primary full" data-do="random">🎲 Sortear e confirmar 3 Pokémon</button><small>O sorteio é secreto e usa espécies da Pokédex inteira. Ou monte sua própria equipe abaixo.</small></p><div class="line"><small>${speciesCount} espécies · ${Object.keys(dex).length} formas disponíveis</small></div><input id="search" placeholder="Buscar por nome, número ou tipo" autocomplete="off" value="${esc(catalogQuery)}"><div class="line"><select id="gen" aria-label="Geração"><option value="">Todas as gerações</option>${Array.from(new Set(Object.values(dex).map(p=>p.generation).filter(Boolean))).sort((a,b)=>a-b).map(g=>`<option value="${g}" ${String(g)===catalogGen?'selected':''}>Geração ${g}</option>`).join('')}</select><select id="forms" aria-label="Formas"><option value="all" ${catalogForms==='all'?'selected':''}>Todas as formas</option><option value="base" ${catalogForms==='base'?'selected':''}>Espécies padrão</option></select></div><div class="catalog" id="catalog"></div><div id="catalogNav" style="margin-top:10px"></div><br><button class="primary full" data-do="team" ${chosen.length!==3?'disabled':''}>Confirmar equipe (${chosen.length}/3)</button>`;}html+='</div>';}
else{const p=me.team[me.active],q=other.team[other.active];html+=`<div class="line" style="margin:12px 0"><b>${state.phase==='end'?'Batalha encerrada':`TURNO ${state.turn}`}</b><small>${esc(me.name)} · lado azul</small></div><div class="arena">${plate(p,'own')}${plate(q,'enemy')}</div><div class="panel">`;
if(state.phase==='end'){html+=`<h2 class="center">${state.winner===-1?'Empate!':state.winner===state.you?'🏆 Você venceu!':'🏆 '+esc(other.name)+' venceu!'}</h2><button class="primary full" data-do="rematch" ${state.ready[state.you]?'disabled':''}>${state.ready[state.you]?'Aguardando revanche…':'Nova batalha / revanche'}</button>`;}
else if(state.phase==='replace'){html+=`<p class="waiting">${p.hp?'Aguardando a substituição do adversário…':'Escolha seu próximo Pokémon'}</p>`;}
else if(state.ready[state.you]){html+=`<p class="waiting">Ataque confirmado e oculto. Aguardando adversário…</p>`;}
else{html+=`<div class="actions">${p.moves.map(n=>{let m=moves[n];return `<button class="move" style="background:${colors[m.type]||'#354b60'}" data-do="move" data-n="${esc(n)}" ${n==='Ataque Surpresa'&&p.age>0?'disabled':''}><b>${esc(n)}</b><small>${esc(m.type)} · ${m.cat==='S'?'Status':m.cat==='F'?'Físico':'Especial'}<br>${m.power?m.power+' poder · ':''}${m.acc}% precisão</small></button>`}).join('')}</div>`;}
html+=`<h3 style="margin-bottom:8px">Sua equipe</h3><div class="team">${me.team.map((x,j)=>teamCard(x,j,j===me.active,x.hp&&j!==me.active&&(state.phase==='replace'&&!p.hp?'replace':state.phase==='battle'&&!state.ready[state.you]&&state.canSwitch?'switch':''))).join('')}</div><h3 style="margin-bottom:8px">Equipe adversária</h3><div class="team">${other.team.map((x,j)=>teamCard(x,j,j===other.active,'')).join('')}</div></div><div class="panel"><b>Registro de combate</b><div class="log">${state.log.slice().reverse().map(l=>`<div>${esc(l)}</div>`).join('')}</div></div>`;}
app.innerHTML=html;const s=document.getElementById('search');if(s){s.oninput=()=>{catalogQuery=s.value;catalogPage=0;renderCatalog()};document.getElementById('gen').onchange=e=>{catalogGen=e.target.value;catalogPage=0;renderCatalog()};document.getElementById('forms').onchange=e=>{catalogForms=e.target.value;catalogPage=0;renderCatalog()};renderCatalog();}}
app.addEventListener('click',async e=>{let b=e.target.closest('button[data-do]');if(!b||b.disabled)return;let op=b.dataset.do,n=b.dataset.n,i=Number(b.dataset.i);if(op==='create'||op==='join')return command(op,{name:document.getElementById('name').value,code:document.getElementById('code').value});if(op==='copy'){try{await navigator.clipboard.writeText(state.code);b.textContent='Copiado!'}catch{error.textContent='Código: '+state.code;}return;}if(op==='random'){if(!confirm('Sortear 3 Pokémon e confirmar sua equipe? Não será possível trocar antes da batalha.'))return;return command('random_team');}if(op==='prev'||op==='next'){catalogPage+=op==='prev'?-1:1;renderCatalog();return;}if(op==='pick'){if(chosen.includes(n))chosen=chosen.filter(x=>x!==n);else if(chosen.length<3)chosen.push(n);render(true);return;}if(op==='team')return command('team',{team:chosen});if(op==='move')return command('action',{turn:state.turn,action:{kind:'move',move:n}});if(op==='switch')return command('action',{turn:state.turn,action:{kind:'switch',target:i}});if(op==='replace')return command('replace',{target:i});if(op==='rematch')return command('rematch');});
document.getElementById('exit').onclick=()=>{if(!confirm('Sair desta sessão? Guarde o código. A sessão neste aparelho será removida.'))return;session=null;state=null;chosen=[];localStorage.removeItem('arenaSession');render(true)};
(async()=>{try{const d=await(await fetch('/dex')).json();dex=d.dex;moves=d.moves;speciesCount=d.speciesCount||Object.keys(dex).length;render(true);if(session)await poll();setInterval(poll,1200);}catch(e){error.textContent='Não foi possível conectar ao servidor.'}})();
</script></body></html>
