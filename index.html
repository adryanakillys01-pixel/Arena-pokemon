/* Arena V3: perspective, turn-by-turn action, accessible controls */
:root{--gold:#edc66b;--ice:#73c7ff;--red:#ff857c}
body{background:radial-gradient(ellipse at 50% 0,#1b3557 0,#081321 55%);min-height:100vh}

.fighter{position:relative}.fighter .plate{background:linear-gradient(145deg,#122e49f5,#102033ef);border-width:1.5px;box-shadow:0 5px 12px #0006;z-index:3}.enemy .plate{background:linear-gradient(145deg,#542b36f5,#281b2cef)}.plate strong{overflow-wrap:anywhere}.fighter.own .sprite{align-self:center;margin:0 0 4px;width:min(100%,225px);height:190px;filter:drop-shadow(0 14px 6px #28231870)}.fighter.enemy .sprite{align-self:center;margin:0 0 46px;width:min(100%,180px);height:155px;transform:none;filter:drop-shadow(0 10px 5px #28231870)}
.sprite{animation:idle 2.7s ease-in-out infinite;transform-origin:50% 90%}.fighter.enemy .sprite{animation-delay:-1.3s}.fighter .sprite.knocked{opacity:.25;filter:grayscale(1);animation:none}.typepill{display:inline-block;border-radius:5px;padding:2px 6px;margin:2px 3px 0 0;font-size:10px;font-weight:800;background:#52647b;color:white}.bar{height:11px;border:1px solid #ffffff22;background:#091a2b}.bar i{box-shadow:inset 0 2px 0 #ffffff55}
.battletext{background:#101d2f;border:1px solid #596d89;border-left:3px solid var(--gold);border-radius:12px;padding:12px;min-height:56px;margin:9px 0;font-weight:650;line-height:1.45}.battletext small{display:block;font-weight:500;margin-top:3px}.move{position:relative;min-height:90px;box-shadow:inset 0 1px 0 #ffffff25,0 3px 0 #0004;transition:transform .12s}.move:active{transform:scale(.97)}.move .pp{position:absolute;right:7px;bottom:7px;font-size:11px;border-radius:5px;background:#0005;padding:2px 5px}.move small{padding-right:28px}.move .hint{color:#f8dc87}.team .member{border-radius:10px}.team .member:disabled{opacity:.85}.team .member:disabled .bar{opacity:1}.team .member.fainted{filter:grayscale(1);opacity:.45}.statsdetails{font-size:12px;color:#d8e5f1;margin:8px 0 12px}.statsdetails summary{cursor:pointer;font-weight:700;color:#d6e8ff}.statsgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.statsgrid span{background:#0a1b2d;padding:7px 5px;border-radius:6px;text-align:center}.statsgrid b{display:block;color:#fff}.impact{position:absolute;z-index:7;pointer-events:none;font-weight:950;font-size:28px;text-shadow:0 2px 3px #000,0 0 10px #fff3;color:#fff;white-space:nowrap}.fxorb{position:absolute;z-index:6;pointer-events:none;width:36px;height:36px;border-radius:50%;background:var(--fx);box-shadow:0 0 15px 6px var(--fx),0 0 4px 2px #fff;mix-blend-mode:screen}.arena.flash{animation:screenflash .24s ease-out}.turnbanner{font-size:12px;color:var(--gold);letter-spacing:1px;font-weight:850}.statusline{font-size:12px;color:#bed3e8}
@keyframes idle{0%,100%{translate:0 0}50%{translate:0 -5px}}@keyframes screenflash{0%{filter:brightness(1.35)}100%{filter:brightness(1)}}
@media(min-width:640px){.arena{min-height:440px}.fighter.own .sprite{height:260px;width:260px}.fighter.enemy .sprite{height:220px;width:220px;margin-bottom:65px}.actions{grid-template-columns:repeat(2,1fr)}}
@media(max-width:380px){main{padding:8px}.arena{min-height:300px;padding:8px}.fighter.own .sprite{height:155px}.fighter.enemy .sprite{height:130px}.plate strong{font-size:14px}.move{padding:9px;min-height:82px}.move b{font-size:13px}}
@media(prefers-reduced-motion:reduce){.sprite,.arena.flash{animation:none}.bar i{transition:none}}

.homehero{padding:24px 8px;background:radial-gradient(ellipse at 50% 100%,#285a88,#10243a 70%);border-radius:12px;margin-bottom:16px}.homehero h1{font-size:clamp(26px,6vw,40px);margin:8px 0;color:#f7d67e}.homehero small{letter-spacing:2px;font-weight:900}.homebuttons{display:grid;gap:9px}.homebuttons button{min-height:48px}.modebar{text-align:center;color:#eed08c;font-size:11px;letter-spacing:1px;margin:8px 0 4px;font-weight:800}.draftbox{text-align:center;padding:22px 12px;border:1px solid #466586;border-radius:12px;background:radial-gradient(#23405d,#10263c)}.bigdice{font-size:54px}.toolbar{display:flex;gap:5px}.confirmbar{display:grid;gap:7px;margin-top:10px;padding:10px;border:1px solid #536e88;border-radius:12px;background:#0c1e31}.confirmbar small{text-align:center;min-height:17px;color:#ffdc88}.dangerbtn{display:block;margin:16px auto;color:#f9a5a5;background:#321d2b;border-color:#79444e;font-size:12px}.move.selected{outline:3px solid #ffda70;box-shadow:0 0 16px #fbbf2455}.homebuttons button:active,.confirmbar button:active{transform:scale(.98)}
</style></head><body><main><header><div><div class="brand">⚔ ARENA POKÉMON</div><small>Liga de treinadores · multiplayer V6</small></div><button id="exit" class="hidden">Sair</button></header><div id="error" class="error" role="alert"></div><div id="app"></div><div class="footer">Projeto de fã não oficial · Combate simplificado · Nível 50</div></main><script>
let dex={},moves={},session=JSON.parse(localStorage.getItem('arenaSession')||'null'),state=null,chosen=[],busy=false,lastRender='',timer=null,speciesCount=0,catalogQuery='',catalogGen='',catalogForms='all',catalogPage=0;
const PAGE_SIZE=48;
let speed=1,formatChoice='classic',selectedAction=null,actionTurn=null;
let playing=false,replayText='',audioEnabled=false,audioCtx=null,polling=false;
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const pause=ms=>new Promise(r=>setTimeout(r,reduced()?Math.min(ms,90):ms/speed));
const app=document.getElementById('app'),error=document.getElementById('error');
const colors={'Fogo':'#9c3927','Água':'#155d99','Planta':'#297a47','Terra':'#815733','Normal':'#4c6072','Fada':'#a64d85','Veneno':'#73439a','Elétrico':'#8b6916','Gelo':'#267e91','Psíquico':'#934776','Fantasma':'#60428f','Sombrio':'#3c384d','Pedra':'#77674a','Lutador':'#984b36','Aço':'#506777','Voador':'#535f9b','Dragão':'#5441a3','Inseto':'#577d30'};
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const image=(p,cls='')=>`<img loading="${cls==='sprite'?'eager':'lazy'}" decoding="async" class="${cls}" alt="${esc(p.name)}" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.id}.png" onerror="this.outerHTML='<span class=\'sprite-fallback\'>◈</span>'">`;
async function api(op,extra={}){const response=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op,...session,...extra})});const data=await response.json();if(!response.ok)throw Error(data.error||'Falha de conexão');return data;}
async function command(op,extra={}){if(busy||playing)return;busy=true;error.textContent='';try{const data=await api(op,extra);if(data.token){session={code:data.state.code,token:data.token};localStorage.setItem('arenaSession',JSON.stringify(session));}if(data.state.phase!=='teams')chosen=[];await receiveState(data.state,true);}catch(e){error.textContent=e.message;}finally{busy=false;}}
async function poll(){if(!session||busy||playing||polling)return;polling=true;try{const prev=session,prevState=state,data=await api('state');if(busy||playing||session!==prev||state!==prevState)return;error.textContent='';await receiveState(data.state);}catch(e){error.textContent=e.message;if(/Sala não encontrada|Sessão inválida/.test(e.message)){session=null;state=null;localStorage.removeItem('arenaSession');render(true);error.textContent='A sala anterior não está mais disponível. Crie uma nova.';}}finally{polling=false;}}
function tone(freq=220,length=.13,type='sine'){
  if(!audioEnabled||!audioCtx)return;try{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*.55),t+length);g.gain.setValueAtTime(.065,t);g.gain.exponentialRampToValueAtTime(.001,t+length);o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+length);}catch{}
}
function animate(el,keys,options){if(!el||reduced()||!el.animate)return Promise.resolve();return el.animate(keys,{...options,duration:(options.duration||0)/speed}).finished.catch(()=>{});}
function battleMessage(lines){replayText=lines.filter(Boolean).join(' · ');const node=document.getElementById('battletext');if(node)node.textContent=replayText;}
function effectHint(m,q){if(!m||m.cat==='S'||!q)return '';const chart={Normal:[[],['Pedra','Aço'],['Fantasma']],Fogo:[['Planta','Gelo','Inseto','Aço'],['Fogo','Água','Pedra','Dragão'],[]],Água:[['Fogo','Terra','Pedra'],['Água','Planta','Dragão'],[]],Elétrico:[['Água','Voador'],['Elétrico','Planta','Dragão'],['Terra']],Planta:[['Água','Terra','Pedra'],['Fogo','Planta','Veneno','Voador','Inseto','Dragão','Aço'],[]],Gelo:[['Planta','Terra','Voador','Dragão'],['Fogo','Água','Gelo','Aço'],[]],Lutador:[['Normal','Gelo','Pedra','Sombrio','Aço'],['Veneno','Voador','Psíquico','Inseto','Fada'],['Fantasma']],Veneno:[['Planta','Fada'],['Veneno','Terra','Pedra','Fantasma'],['Aço']],Terra:[['Fogo','Elétrico','Veneno','Pedra','Aço'],['Planta','Inseto'],['Voador']],Voador:[['Planta','Lutador','Inseto'],['Elétrico','Pedra','Aço'],[]],Psíquico:[['Lutador','Veneno'],['Psíquico','Aço'],['Sombrio']],Inseto:[['Planta','Psíquico','Sombrio'],['Fogo','Lutador','Veneno','Voador','Fantasma','Aço','Fada'],[]],Pedra:[['Fogo','Gelo','Voador','Inseto'],['Lutador','Terra','Aço'],[]],Fantasma:[['Psíquico','Fantasma'],['Sombrio'],['Normal']],Dragão:[['Dragão'],['Aço'],['Fada']],Sombrio:[['Psíquico','Fantasma'],['Lutador','Sombrio','Fada'],[]],Aço:[['Gelo','Pedra','Fada'],['Fogo','Água','Elétrico','Aço'],[]],Fada:[['Lutador','Dragão','Sombrio'],['Fogo','Veneno','Aço'],[]]};let c=chart[m.type];if(!c)return '';let x=q.types.reduce((a,t)=>a*(c[2].includes(t)?0:c[0].includes(t)?2:c[1].includes(t)?.5:1),1);return x===0?'Imune por tipo':x>1?'Super efetivo '+x+'×':x<1?'Pouco efetivo '+x+'×':'';
}
function frameUpdate(frame){
  for(let j=0;j<2;j++){const target=frame.after[j],p=state.players[j];if(!p||!p.team[target.active])continue;p.active=target.active;Object.assign(p.team[target.active],{hp:target.hp,status:target.status});}
  render(true);
}
async function playFrame(frame){
  const actor=frame.actor===state.you?'own':'enemy',target=actor==='own'?'enemy':'own';
  const arena=document.querySelector('.arena'),a=document.querySelector('.'+actor+' .sprite'),b=document.querySelector('.'+target+' .sprite');
  const lines=frame.lines||[],move=frame.move&&moves[frame.move];battleMessage(lines.length?[lines[0]]:[frame.kind==='residual'?'Efeitos do fim do turno…':'Turno em andamento…']);
  const damage=frame.actor>=0?Math.max(0,frame.before[1-frame.actor].hp-frame.after[1-frame.actor].hp):0;
  if(frame.kind==='move'&&a&&move&&lines.some(l=>l.includes(' usa '))){
    if(move.cat==='F'){tone(170,.11,'triangle');await animate(a,[{translate:'0 0'},{translate:(actor==='own'?'24px -9px':'-24px 9px')},{translate:'0 0'}],{duration:320,easing:'ease-in-out'});}
    else if(move.cat==='E'&&arena&&b&&!reduced()){
      const ar=arena.getBoundingClientRect(),aa=a.getBoundingClientRect(),bb=b.getBoundingClientRect(),orb=document.createElement('div');orb.className='fxorb';orb.style.setProperty('--fx',colors[move.type]||'#7ce4ff');orb.style.left=(aa.left-ar.left+aa.width/2-18)+'px';orb.style.top=(aa.top-ar.top+aa.height/2-18)+'px';arena.append(orb);tone(480,.24,'sine');await animate(orb,[{translate:'0 0',scale:.4},{translate:(bb.left+bb.width/2-aa.left-aa.width/2)+'px '+(bb.top+bb.height/2-aa.top-aa.height/2)+'px',scale:1.4}],{duration:380,easing:'ease-in'});orb.remove();
    }else{tone(660,.2);await animate(a,[{filter:'brightness(1)'},{filter:'brightness(1.8) drop-shadow(0 0 13px #eecb6b)'},{filter:'brightness(1)'}],{duration:400});}
  }
  if(damage&&b&&arena){tone(105,.18,'triangle');const rect=b.getBoundingClientRect(),ar=arena.getBoundingClientRect(),label=document.createElement('div');label.className='impact';label.textContent='−'+damage;label.style.left=(rect.left-ar.left+rect.width*.25)+'px';label.style.top=(rect.top-ar.top+rect.height*.25)+'px';arena.append(label);await Promise.all([animate(b,[{translate:'0 0',filter:'brightness(1)'},{translate:'8px 0',filter:'brightness(2) saturate(0)'},{translate:'-5px 0'},{translate:'0 0'}],{duration:280}),animate(label,[{translate:'0 8px',opacity:1},{translate:'0 -23px',opacity:0}],{duration:540})]);label.remove();}
  battleMessage(lines);
  const bars=frame.after.map((p,j)=>{const old=frame.before[j],side=j===state.you?'own':'enemy';if(p.active!==old.active||p.hp===old.hp)return Promise.resolve();const el=document.querySelector('.'+side+' .plate .bar i');if(!el)return Promise.resolve();return animate(el,[{width:(100*old.hp/old.maxHp)+'%'},{width:(100*p.hp/p.maxHp)+'%'}],{duration:380,fill:'forwards',easing:'ease-out'});});
  await Promise.all(bars);frameUpdate(frame);await pause(lines.length>2?900:650);
}
async function receiveState(next,force=false){
  if(state&&state.code===next.code&&['battle','replace'].includes(state.phase)&&next.replay?.id&&next.replay.id!==state.replay?.id&&next.replay.frames?.length){
    playing=true;try{state=JSON.parse(JSON.stringify(state));render(true);for(const frame of next.replay.frames)await playFrame(frame);}finally{playing=false;replayText='';state=next;render(true);}
  }else{state=next;render(force);}
}
function bar(p){const pc=100*p.hp/p.stats[0];return `<div class="bar"><i style="width:${pc}%;background:${pc>50?'#40d37b':pc>25?'#f1ba42':'#f15b5b'}"></i></div><small>${p.hp}/${p.stats[0]} HP</small>`;}
function teamCard(p,j,on,action){return `<button class="member ${on||action==='switch'&&selectedAction?.kind==='switch'&&selectedAction.target===j?'selected':''} ${p.hp===0?'fainted':''}" ${action?'':'disabled'} data-do="${action||''}" data-i="${j}">${image(p)}<b>${esc(p.name)}</b>${bar(p)}${p.status?`<small>${esc(p.status)}</small>`:''}</button>`;}
function score(){return `<div class="score"><div class="blue">${esc(state.players[0].name)}<br><strong>${state.score[0]}</strong></div><div><small>SALA ${esc(state.code)}</small><br>VS</div><div class="red">${esc(state.players[1]?.name||'Aguardando')}<br><strong>${state.score[1]}</strong></div></div>`;}
function plate(p,side){const labels=['ATQ','DEF','ATQ ESP','DEF ESP','VEL','PREC'];return `<div class="fighter ${side}"><div class="plate"><div class="line"><strong>${esc(p.name)}</strong><small>Nv.50</small></div><div>${p.types.map(t=>`<span class="typepill" style="background:${colors[t]||'#546777'}">${esc(t)}</span>`).join('')}</div>${bar(p)}<div>${p.status?`<span class="tag">${esc(p.status)}</span>`:''}${p.st.map((v,i)=>v?`<span class="tag">${labels[i]} ${v>0?'+':''}${v}</span>`:'').join('')}</div></div>${image(p,'sprite'+(p.hp===0?' knocked':''))}</div>`;}
function renderCatalog(){
  const list=document.getElementById('catalog'),nav=document.getElementById('catalogNav');
  if(!list||!nav)return;
  const norm=x=>String(x??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  const q=norm(catalogQuery.trim());
  const entries=Object.values(dex).filter(p=>(!catalogGen||String(p.generation)===catalogGen)&&(catalogForms==='all'||p.default!==false)&&(norm(p.name).includes(q)||String(p.id)===q||norm(p.types.join(' ')).includes(q))).sort((a,b)=>a.id-b.id);
  const pages=Math.max(1,Math.ceil(entries.length/PAGE_SIZE));catalogPage=Math.max(0,Math.min(catalogPage,pages-1));
  list.innerHTML=entries.slice(catalogPage*PAGE_SIZE,(catalogPage+1)*PAGE_SIZE).map(p=>`<button class="${chosen.includes(p.name)?'selected':''}" data-do="pick" data-n="${esc(p.name)}">${image(p)}${esc(p.name)}<small>#${p.id} · ${esc(p.types.join('/'))}</small></button>`).join('')||'<p>Nenhum Pokémon encontrado.</p>';
  nav.innerHTML=`<div class="line"><button data-do="prev" ${catalogPage===0?'disabled':''}>‹ Anterior</button><small>${catalogPage+1}/${pages} · ${entries.length} resultados</small><button data-do="next" ${catalogPage+1>=pages?'disabled':''}>Próxima ›</button></div>`;
}
function render(force=false){if(actionTurn!==state?.turn||state?.phase!=='battle'||state?.ready?.[state.you]){selectedAction=null;actionTurn=state?.turn;}const key=JSON.stringify(state);if(!force&&key===lastRender)return;lastRender=key;document.getElementById('exit').classList.toggle('hidden',!session);if(!session||!state){app.innerHTML=`<div class="panel center"><div class="homehero"><small>LIGA DE TREINADORES</small><h1>Entre na arena</h1><p class="muted">Desafie um amigo ou treine contra um rival virtual.</p></div><label>Seu nome<input id="name" maxlength="24" placeholder="Nome do treinador"></label><label>Formato da partida<select id="format"><option value="classic" ${formatChoice==='classic'?'selected':''}>Clássico — escolha livre ou sorteio</option><option value="balanced" ${formatChoice==='balanced'?'selected':''}>Equilibrado — sorteio justo, sem lendários</option></select></label><a href="/expedition" style="display:block;background:linear-gradient(125deg,#365d39,#2d7c67);padding:16px;border:1px solid #ebbb70;border-radius:12px;text-align:center;color:white;font-weight:850;text-decoration:none;margin-bottom:12px">🌿 NOVO: Pokémon Expedição<br><small style="color:#e5f3d5">Explore, capture e evolua seu acampamento</small></a><a href="/rpg" style="display:block;background:linear-gradient(125deg,#a23e53,#4848a0);padding:16px;border:1px solid #ebbb70;border-radius:12px;text-align:center;color:white;font-weight:850;text-decoration:none;margin-bottom:12px">🎮 NOVO: RPG em tempo real<br><small style="color:#f2d5af">Controle seu Pokémon com joystick, ataques e esquivas</small></a><div class="homebuttons"><button class="primary full" data-do="create">⚔ Criar sala multiplayer</button><button class="full" data-do="solo">🤖 Treinar contra rival IA</button></div><p class="muted">ou entre com um código de amigo</p><input id="code" maxlength="6" placeholder="Código da sala" value="${esc(new URLSearchParams(location.search).get('room')||'')}" autocapitalize="characters"><button class="full" data-do="join">Entrar na sala</button></div>`;return;}
const me=state.players[state.you],other=state.players[1-state.you];let html=score()+`<div class="modebar">${state.solo?'🤖 TREINO SOLO':'⚔ MULTIPLAYER'} · ${state.format==='balanced'?'EQUILIBRADO':'CLÁSSICO'}</div>`;
if(state.phase==='lobby'){html+=`<div class="panel center"><small>ENVIE ESTE CÓDIGO AO ADVERSÁRIO</small><h1 style="letter-spacing:5px">${esc(state.code)}</h1><button data-do="copy">Copiar código</button> <button data-do="invite">Compartilhar convite</button><p class="waiting">Aguardando segundo treinador…</p></div>`;}
else if(state.phase==='teams'){html+=`<div class="panel"><h2>Monte sua equipe</h2><p class="muted">${state.format==='balanced'?'O servidor sorteia três Pokémon de força semelhante e tipos variados, sem lendários.':'Escolha 3 Pokémon. O primeiro será seu inicial. A equipe fica oculta até ambos confirmarem.'}</p>`;if(me.selected){html+=`<p class="waiting">Equipe confirmada. Aguardando ${esc(other.name)}.</p><div class="team">${me.team.map((p,j)=>teamCard(p,j,j===0,'')).join('')}</div>`;}else if(state.format==='balanced'){html+=`<div class="draftbox"><div class="bigdice">🎲</div><h3>Desafio equilibrado</h3><p class="muted">Três espécies diferentes, força semelhante e variedade de tipos.</p><button class="primary full" data-do="balanced">Sortear minha equipe</button></div>`;}else{html+=`<div class="team">${[0,1,2].map(j=>`<div class="slot">${j===0?'Inicial':`Reserva ${j}`}<br><b>${esc(chosen[j]||'—')}</b></div>`).join('')}</div><p><button class="primary full" data-do="random">🎲 Sortear e confirmar 3 Pokémon</button><small>Sorteio livre de espécies da Pokédex.</small></p><p><button class="full" data-do="balanced">⚖ Sortear equipe equilibrada</button><small>Sem lendários, com força e tipos variados.</small></p><div class="line"><small>${speciesCount} espécies · ${Object.keys(dex).length} formas disponíveis</small></div><input id="search" placeholder="Buscar por nome, número ou tipo" autocomplete="off" value="${esc(catalogQuery)}"><div class="line"><select id="gen" aria-label="Geração"><option value="">Todas as gerações</option>${Array.from(new Set(Object.values(dex).map(p=>p.generation).filter(Boolean))).sort((a,b)=>a-b).map(g=>`<option value="${g}" ${String(g)===catalogGen?'selected':''}>Geração ${g}</option>`).join('')}</select><select id="forms" aria-label="Formas"><option value="all" ${catalogForms==='all'?'selected':''}>Todas as formas</option><option value="base" ${catalogForms==='base'?'selected':''}>Espécies padrão</option></select></div><div class="catalog" id="catalog"></div><div id="catalogNav" style="margin-top:10px"></div><br><button class="primary full" data-do="team" ${chosen.length!==3?'disabled':''}>Confirmar equipe (${chosen.length}/3)</button>`;}html+='</div>';}
else{const p=me.team[me.active],q=other.team[other.active];html+=`<div class="line" style="margin:12px 0"><b class="turnbanner">${state.phase==='end'?'BATALHA ENCERRADA':`TURNO ${state.turn}`}</b><div class="toolbar"><button data-do="speed" style="padding:6px 9px;font-size:12px">${speed}×</button><button data-do="sound" style="padding:6px 9px;font-size:12px">${audioEnabled?'🔊 Som ligado':'🔇 Som desligado'}</button></div></div><div class="arena">${plate(p,'own')}${plate(q,'enemy')}</div><div id="battletext" class="battletext" aria-live="polite">${esc(replayText||state.log.slice(-1)[0]||'Escolha seu próximo movimento.')}</div><div class="panel">`;
if(playing){html+=`<div class="waiting">⚔ Resolvendo o turno…</div>`;}else if(state.phase==='end'){html+=`<h2 class="center">${state.winner===-1?'Empate!':state.winner===state.you?'🏆 Você venceu!':'🏆 '+esc(other.name)+' venceu!'}</h2><button class="primary full" data-do="rematch" ${state.ready[state.you]?'disabled':''}>${state.ready[state.you]?'Aguardando revanche…':'Nova batalha / revanche'}</button>`;}
else if(state.phase==='replace'){html+=`<p class="waiting">${p.hp?'Aguardando a substituição do adversário…':'Escolha seu próximo Pokémon'}</p>`;}
else if(state.ready[state.you]){html+=`<div class="waiting">Jogada confirmada. Aguardando adversário…<br><button data-do="cancel" style="margin-top:8px">Alterar minha escolha</button></div>`;}
else{html+=`<div class="actions">${[...new Set([...p.moves,...(state.legalMoves||[])])].map(n=>{let m=moves[n];if(!m)return '';let pp=p.pp?.[n]??m.pp??10,legal=(state.legalMoves||p.moves).includes(n),hint=n==='Debater-se'?'':effectHint(m,q);return `<button class="move ${selectedAction?.kind==='move'&&selectedAction.move===n?'selected':''}" style="background:${colors[m.type]||'#354b60'}" data-do="move" data-n="${esc(n)}" ${!legal||n==='Ataque Surpresa'&&p.age>0?'disabled':''}><b>${esc(n)}</b><small>${esc(m.type)} · ${m.cat==='S'?'Status':m.cat==='F'?'Físico':'Especial'}<br>${m.power?m.power+' poder · ':''}${m.acc}% precisão${hint?`<br><span class="hint">${esc(hint)}</span>`:''}</small><span class="pp">${n==='Debater-se'?'—':pp+'/'+(m.pp??10)} PP</span></button>`}).join('')}</div><div class="confirmbar"><small>${selectedAction?esc(selectedAction.kind==='move'?selectedAction.move:'Trocar para '+me.team[selectedAction.target].name):'Selecione um golpe ou um Pokémon da reserva.'}</small><button class="primary full" data-do="confirmAction" ${selectedAction?'':'disabled'}>Confirmar jogada</button></div>`;}
html+=`<details class="statsdetails"><summary>Atributos e habilidades em campo</summary><p><b>${esc(p.name)}</b> · ${esc(p.ability||'—')}</p><div class="statsgrid">${['HP','ATQ','DEF','ATQ ESP','DEF ESP','VEL'].map((n,j)=>`<span>${n}<b>${p.stats[j]}${j&&p.st[j-1]?` (${p.st[j-1]>0?'+':''}${p.st[j-1]})`:''}</b></span>`).join('')}</div><p><b>${esc(q.name)}</b> · ${esc(q.ability||'—')}</p><div class="statsgrid">${['HP','ATQ','DEF','ATQ ESP','DEF ESP','VEL'].map((n,j)=>`<span>${n}<b>${q.stats[j]}</b></span>`).join('')}</div><small>Efetividade indicada nos golpes considera os tipos; habilidades podem alterar o resultado.</small></details><h3 style="margin-bottom:8px">Sua equipe · toque para trocar</h3><div class="team">${me.team.map((x,j)=>teamCard(x,j,j===me.active,!playing&&x.hp&&j!==me.active&&(state.phase==='replace'&&!p.hp?'replace':state.phase==='battle'&&!state.ready[state.you]&&state.canSwitch?'switch':''))).join('')}</div><h3 style="margin-bottom:8px">Equipe adversária</h3><div class="team">${other.team.map((x,j)=>teamCard(x,j,j===other.active,'')).join('')}</div></div><div class="panel"><b>Registro de combate</b><div class="log">${state.log.slice().reverse().map(l=>`<div>${esc(l)}</div>`).join('')}</div></div>${!playing&&['battle','replace'].includes(state.phase)?'<button class="dangerbtn" data-do="forfeit">Desistir da batalha</button>':''}`;}
app.innerHTML=html;const s=document.getElementById('search');if(s){s.oninput=()=>{catalogQuery=s.value;catalogPage=0;renderCatalog()};document.getElementById('gen').onchange=e=>{catalogGen=e.target.value;catalogPage=0;renderCatalog()};document.getElementById('forms').onchange=e=>{catalogForms=e.target.value;catalogPage=0;renderCatalog()};renderCatalog();}}
app.addEventListener('click',async e=>{let b=e.target.closest('button[data-do]');if(!b||b.disabled)return;let op=b.dataset.do,n=b.dataset.n,i=Number(b.dataset.i);if(op==='sound'){audioEnabled=!audioEnabled;if(audioEnabled){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();tone(520,.12)}catch{audioEnabled=false}}b.textContent=audioEnabled?'🔊 Som ligado':'🔇 Som desligado';return;}if(playing)return;if(op==='speed'){speed=speed===1?2:speed===2?3:1;b.textContent=speed+'×';return;}if(op==='create'||op==='join'||op==='solo'){formatChoice=document.getElementById('format')?.value||'classic';return command(op,{name:document.getElementById('name').value,code:document.getElementById('code').value,format:formatChoice});}if(op==='invite'){const u=new URL(location.origin+'/index.html');u.searchParams.set('room',state.code);try{if(navigator.share)await navigator.share({title:'Arena Pokémon',text:'Entre na minha sala '+state.code,url:u.href});else await navigator.clipboard.writeText(u.href);b.textContent='Convite pronto!'}catch{error.textContent='Código: '+state.code;}return;}if(op==='copy'){try{await navigator.clipboard.writeText(state.code);b.textContent='Copiado!'}catch{error.textContent='Código: '+state.code;}return;}if(op==='balanced'){if(!confirm('Sortear e confirmar uma equipe equilibrada?'))return;return command('balanced_team');}if(op==='random'){if(!confirm('Sortear 3 Pokémon e confirmar sua equipe? Não será possível trocar antes da batalha.'))return;return command('random_team');}if(op==='prev'||op==='next'){catalogPage+=op==='prev'?-1:1;renderCatalog();return;}if(op==='pick'){if(chosen.includes(n))chosen=chosen.filter(x=>x!==n);else if(chosen.length<3)chosen.push(n);render(true);return;}if(op==='team')return command('team',{team:chosen});if(op==='move'||op==='switch'){selectedAction=op==='move'?{kind:'move',move:n}:{kind:'switch',target:i};actionTurn=state.turn;render(true);return;}if(op==='confirmAction'&&selectedAction)return command('action',{turn:state.turn,action:selectedAction});if(op==='cancel')return command('cancel_action',{turn:state.turn});if(op==='forfeit'){if(confirm('Desistir? O adversário ganhará esta partida.'))return command('forfeit');return;}if(op==='replace')return command('replace',{target:i});if(op==='rematch')return command('rematch');});
document.getElementById('exit').onclick=()=>{if(playing)return;if(!confirm('Sair desta sessão? Guarde o código. A sessão neste aparelho será removida.'))return;session=null;state=null;chosen=[];localStorage.removeItem('arenaSession');render(true)};
(async()=>{try{const d=await(await fetch('/dex')).json();dex=d.dex;moves=d.moves;speciesCount=d.speciesCount||Object.keys(dex).length;render(true);if(session)await poll();setInterval(poll,1200);}catch(e){error.textContent='Não foi possível conectar ao servidor.'}})();
</script></body></html>
