function creature(c,id,x,y,size,face=1,ring=null,flash=0){let im=image(id);c.save();c.translate(x,y);c.fillStyle='#263c2955';c.beginPath();c.ellipse(0,8,size*.27,size*.11,0,0,Math.PI*2);c.fill();if(ring){c.strokeStyle=ring;c.lineWidth=2;c.beginPath();c.ellipse(0,8,size*.3,size*.13,0,0,Math.PI*2);c.stroke()}if(im.complete&&im.naturalWidth){c.scale(face,1);if(flash>0)c.globalAlpha=.62;let z=Math.sin(game.time*5+id)*2,ratio=im.naturalWidth/im.naturalHeight,iw=ratio>=1?size:size*ratio,ih=ratio>=1?size/ratio:size;c.drawImage(im,-iw/2,-ih+13+z,iw,ih);c.globalAlpha=1}else{c.fillStyle=colors[DEX[id]?.types[0]]||'#d8bc78';c.beginPath();c.arc(0,-7,size*.21,0,Math.PI*2);c.fill();c.fillStyle='#172c20';c.font='bold 12px sans-serif';c.textAlign='center';c.fillText((DEX[id]?.name||'#'+id).slice(0,7),0,-5)}c.restore()}
function draw(){let p=game.player,c=ctx;const vw=cv.width,vh=cv.height;cam.x=Math.max(0,Math.min(W-vw,p.x-vw/2));cam.y=Math.max(0,Math.min(H-vh,p.y-vh/2));c.drawImage(bg,cam.x,cam.y,vw,vh,0,0,vw,vh);c.save();c.translate(-cam.x,-cam.y);const visible=o=>o.x>=cam.x-90&&o.x<=cam.x+vw+90&&o.y>=cam.y-90&&o.y<=cam.y+vh+90;
if(visible(CAMP)){drawCamp(c);for(let i=0;i<game.workers.length;i++){let m=game.party[game.workers[i]],a=i*1.8;creature(c,m.id,CAMP.x+Math.cos(a)*100,CAMP.y+Math.sin(a)*78,55,1,'#8ef0bd');}}
for(let n of game.nodes){if(!visible(n))continue;c.globalAlpha=n.cool>0?.25:1;let x=n.x,y=n.y;ellipse(c,x+3,y+7,17,7,'#17251b55');if(n.kind==='wood'){for(let i=0;i<3;i++){c.fillStyle='#76583c';c.fillRect(x-13+i*8,y-10-i*3,9,23);ellipse(c,x-9+i*8,y-10-i*3,5,3,'#d7b680')}}else if(n.kind==='stone'){ellipse(c,x-6,y,11,9,'#8d9da0');ellipse(c,x+6,y+1,10,8,'#b8c6be');ellipse(c,x-8,y-4,6,3,'#e1e6d8')}else{ellipse(c,x,y-5,16,12,'#3d783f');ellipse(c,x-6,y-9,8,7,'#6ba057');for(let i=0;i<4;i++)ellipse(c,x-8+i*5,y-7+(i%2)*7,3,3,'#e65d62')}c.globalAlpha=1}
for(const w of game.wild){if(w.wind>0&&visible(w)){let phase=w.boss&&w.hp<w.max*.5,rad=w.boss?95:48;ellipse(c,w.aimX,w.aimY,rad,rad*.68,'#dc493f40');c.strokeStyle='#ff775b';c.lineWidth=3;c.beginPath();c.ellipse(w.aimX,w.aimY,rad,rad*.68,0,0,Math.PI*2);c.stroke();if(w.boss){c.strokeStyle='#ffad5870';c.lineWidth=8;c.beginPath();c.moveTo(w.x,w.y);c.lineTo(w.aimX,w.aimY);c.stroke()}}}let target=game.target(165);if(target&&visible(target)){c.strokeStyle='#ffe29a';c.lineWidth=2;c.setLineDash([6,5]);c.beginPath();c.ellipse(target.x,target.y+12,34,16,0,0,Math.PI*2);c.stroke();c.setLineDash([])}let entities=game.wild.filter(visible).map(w=>({kind:'wild',...w}));entities.push({kind:'own',id:game.member.id,x:p.x,y:p.y});if(friend&&Date.now()-friend.seen<3500){friend.rx+=(friend.x-friend.rx)*.17;friend.ry+=(friend.y-friend.ry)*.17;entities.push({kind:'friend',id:friend.id,x:friend.rx,y:friend.ry,name:friend.name})}entities.sort((a,b)=>a.y-b.y);
for(let w of entities){if(w.kind==='own'){creature(c,w.id,w.x,w.y,86,p.face,'#fff0a0');if(game.attackFlash>0){c.strokeStyle='#ffe6a9';c.lineWidth=7;c.beginPath();c.arc(w.x,w.y,58,p.face>0?-.95:2.2,p.face>0?.95:4.1);c.stroke();}if(game.specialFlash>0){c.strokeStyle=colors[game.mon.types[0]]||'#fff';c.lineWidth=5;c.beginPath();c.arc(w.x,w.y,45+(1-game.specialFlash/.45)*120,0,Math.PI*2);c.stroke();}if(game.dash){c.strokeStyle='#edf6ff';c.beginPath();c.arc(w.x,w.y,38,0,Math.PI*2);c.stroke()}}else if(w.kind==='friend'){creature(c,w.id,w.x,w.y,80,1,'#9edbff');c.fillStyle='#d7f5ff';c.font='bold 13px sans-serif';c.fillText(w.name,w.x,w.y-55)}else{creature(c,w.id,w.x,w.y,w.boss?120:72,1,w.boss?'#ffcf73':w.aggro?'#f89c83':w.hp/w.max<=.30?'#f5e18d':null,w.hit);c.fillStyle='#233c30';c.fillRect(w.x-28,w.y-55,56,6);c.fillStyle=w.hp/w.max<=.30?'#f7cb69':'#8dd681';c.fillRect(w.x-28,w.y-55,56*w.hp/w.max,6);c.fillStyle='#fff';c.font='12px sans-serif';c.fillText((w.boss?'CHEFE · ':'')+(DEX[w.id]?.name||'Pokémon')+' Nv.'+w.level,w.x,w.y-60)}}
for(const pr of game.projectiles){if(!visible(pr))continue;let col=colors[pr.type]||'#ff9d55';ellipse(c,pr.x-pr.vx*.035,pr.y-pr.vy*.035,15,9,col+'55');ellipse(c,pr.x,pr.y,10,10,col);ellipse(c,pr.x-2,pr.y-2,4,4,'#fff5d0')}for(let f of game.fx){c.globalAlpha=Math.min(1,f.t*3);c.fillStyle=f.color;c.font='bold 22px sans-serif';c.fillText(f.text,f.x,f.y)}c.globalAlpha=1;c.restore();drawMini()}
function drawMini(){const el=document.getElementById('mini');if(!el)return;let c=el.getContext('2d'),sx=el.width/W,sy=el.height/H;for(const r of regions){c.fillStyle=r.color;c.fillRect(r.x*sx,r.y*sy,640*sx,620*sy)}c.strokeStyle='#fff6';c.strokeRect(cam.x*sx,cam.y*sy,cv.width*sx,cv.height*sy);for(const [p,color,size] of [[CAMP,'#fff4aa',3],[bossSpot,'#ff4d47',3],[game.player,'#fff',3]]){c.fillStyle=color;c.beginPath();c.arc(p.x*sx,p.y*sy,size,0,Math.PI*2);c.fill()}if(friend&&Date.now()-friend.seen<3500){c.fillStyle='#2bd6ff';c.beginPath();c.arc(friend.x*sx,friend.y*sy,3,0,Math.PI*2);c.fill()}}
function hud(force=false){if(!game)return;const p=game.player,m=game.member,bag=game.bag;document.getElementById('mon').textContent=game.mon.name+' · Nv. '+m.level;document.getElementById('hp').style.width=(100*p.hp/game.maxHp())+'%';document.getElementById('energy').style.width=p.energy+'%';document.getElementById('stats').textContent=Math.ceil(p.hp)+'/'+game.maxHp()+' HP · XP '+m.xp+'/'+xpNeed(m.level)+' · Derrotas '+game.deaths;document.getElementById('bag').textContent='🪵 '+bag.wood+'   ◆ '+bag.stone+'   🍓 '+bag.berry+'   ◉ '+bag.balls+'   |   Coleção '+game.party.length;document.getElementById('zone').textContent=game.nearCamp()?'⌂ Acampamento · área segura':regionAt(p.x,p.y).name+' · Nv. '+regionAt(p.x,p.y).min+'+';document.getElementById('note').textContent=game.note;const heal=document.querySelector('[data-act="heal"]');heal.textContent=game.healCd>.05?'♥ '+Math.ceil(game.healCd)+'s':'♥ Curar';heal.disabled=game.healCd>.05||!bag.berry;const cap=document.querySelector('[data-act="capture"]');cap.textContent=game.captureCd>.05?'◉ '+game.captureCd.toFixed(1)+'s':'◉ Capturar';cap.disabled=game.captureCd>.05||!bag.balls;document.getElementById('baseTitle').textContent='Acampamento · nível '+game.base;document.getElementById('baseHint').textContent='Receita: 4 madeira + 3 pedra. Melhoria: '+9*game.base+' madeira + '+6*game.base+' pedra. '+(game.nearCamp()?'Você está na base.':'Volte à base para fabricar.');const special=document.getElementById('special');special.textContent=game.specialCd>.05?'✦ '+game.specialCd.toFixed(1)+'s':'✦ Especial';special.disabled=game.specialCd>.05||p.energy<40;document.getElementById('workHint').textContent='Trabalhadores: '+game.workers.length+'/'+game.base+' · cada parceiro produz 1 recurso a cada 25 s de jogo ativo.';let evo=evolutions[m.id];document.getElementById('evolve').disabled=!game.evolution()||!game.nearCamp();document.getElementById('evoHint').textContent=evo?'Evolução disponível no nível '+evo[1]+' (regra simplificada deste RPG).':'Sem evolução cadastrada.';let qkey=JSON.stringify([game.claimed,quests.map(q=>game.questValue(q))]);const qlist=document.getElementById('questsList');if(qlist.dataset.key!==qkey){qlist.dataset.key=qkey;qlist.innerHTML=quests.map((q,i)=>'<div class="quest"><div><b>'+esc(q.title)+'</b><small>'+esc(q.goal)+' · '+Math.min(q.target,game.questValue(q))+'/'+q.target+'</small></div><button data-claim="'+i+'" '+(game.claimed.includes(i)||game.questValue(q)<q.target?'disabled':'')+'>'+(game.claimed.includes(i)?'Recebido':'Receber')+'</button></div>').join('')}const pk=JSON.stringify([game.party,game.active,game.workers]);if(force||pk!==partyKey){partyKey=pk;document.getElementById('party').innerHTML=game.party.map((m,i)=>'<div class="partycell"><button data-switch="'+i+'" class="'+(i===game.active?'active':'')+'"><img loading="lazy" src="'+sprite(m.id)+'" alt="">'+esc(DEX[m.id]?.name||'#'+m.id)+'<br>Nv. '+m.level+'</button><button data-work="'+i+'" '+(i===game.active?'disabled':'')+'>'+(game.workers.includes(i)?'Retirar':({wood:'Madeira',stone:'Pedra',berry:'Frutas'}[jobFor(m.id)]))+'</button></div>').join('')}}
function bindJoy(){let el=document.getElementById('joy'),stick=document.getElementById('stick');const move=e=>{let r=el.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/(r.width*.34),y=(e.clientY-r.top-r.height/2)/(r.height*.34),n=Math.max(1,Math.hypot(x,y));joy.x=x/n;joy.y=y/n;stick.style.transform='translate('+joy.x*r.width*.34+'px,'+joy.y*r.height*.34+'px)'};el.onpointerdown=e=>{if(joy.id!==null)return;joy.id=e.pointerId;el.setPointerCapture(e.pointerId);move(e)};el.onpointermove=e=>{if(e.pointerId===joy.id)move(e)};const stop=e=>{if(e.pointerId!==joy.id)return;joy={x:0,y:0,id:null};stick.style.transform=''};el.onpointerup=el.onpointercancel=el.onlostpointercapture=stop}
function act(a){if(!game)return;if(a==='camp'){document.getElementById('basePanel').classList.remove('hide');game.say('O acampamento fica na parte superior esquerda do mapa.');return}if(['attack','special','capture','gather','dodge','heal','craft','upgrade','evolve'].includes(a)){game[a]();hud();persist()}}
function loop(now){raf=requestAnimationFrame(loop);if(!game)return;let dt=last?Math.min(.05,(now-last)/1000):.016;last=now;let x=joy.id===null?(+ (keys.has('d')||keys.has('arrowright')))-(+ (keys.has('a')||keys.has('arrowleft'))):joy.x,y=joy.id===null?(+ (keys.has('s')||keys.has('arrowdown')))-(+ (keys.has('w')||keys.has('arrowup'))):joy.y;game.step(dt,{x,y});if(autoAttack&&game.cool<=0&&game.target(115))game.attack();if(now-lastPaint>=31){draw();lastPaint=now}if(now-lastHud>=150){hud();lastHud=now}if(now-lastSave>2500){persist();lastSave=now}}
window.addEventListener('keydown',e=>{if(!game||/INPUT|TEXTAREA/.test(e.target.tagName))return;let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys.add(k);if(!e.repeat){if(k===' ')act('attack');if(k==='e')act('gather');if(k==='c')act('capture');if(k==='q')act('dodge');if(k==='f')act('special')}});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>{keys.clear();joy={x:0,y:0,id:null};persist()});document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});window.addEventListener('pagehide',persist);
async function net(op,extra={}){let r=await fetch('/world-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op,...room,...extra})});let d=await r.json();if(!r.ok)throw Error(d.error||'Erro de conexão');return d}
function friendNote(s){let n=document.getElementById('friend');if(n)n.textContent=s}
async function connect(op){if(networkBusy)return;networkBusy=true;try{let d=await net(op,{name:document.getElementById('name').value,code:document.getElementById('code').value});room={code:d.code,token:d.token};document.getElementById('code').value=d.code;friendNote('Sala '+d.code+' · aguardando amigo')}catch(e){friendNote(e.message)}finally{networkBusy=false}}
setInterval(async()=>{if(!room||!game||networkBusy)return;networkBusy=true;const old=room;try{let d=await net('sync',{x:game.player.x,y:game.player.y,id:game.member.id});if(old!==room)return;let p=d.friend;if(p){friend={...p,seen:Date.now(),rx:friend?.rx??p.x,ry:friend?.ry??p.y};friendNote('Sala '+room.code+' · '+p.name+' conectado')}else{friend=null;friendNote('Sala '+room.code+' · aguardando amigo')}}catch(e){friendNote('Conexão instável; exploração local continua. '+e.message)}finally{networkBusy=false}},650);
app.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.start){begin(Number(b.dataset.start));return}if(!game)return;if(b.dataset.claim!==undefined){game.claim(Number(b.dataset.claim));hud();persist();return}if(b.dataset.work!==undefined){game.assign(Number(b.dataset.work));hud(true);persist();return}if(b.dataset.switch!==undefined){game.switch(Number(b.dataset.switch));hud(true);persist();return}if(b.dataset.act){act(b.dataset.act);return}let op=b.dataset.op;if(op==='auto'){autoAttack=!autoAttack;b.textContent='Auto: '+(autoAttack?'ON':'OFF');return}if(op==='party'||op==='base'||op==='quests'){document.getElementById(op+'Panel').classList.toggle('hide');return}if(op==='create'||op==='join'){connect(op);return}if(op==='disconnect'){let old=room;room=null;friend=null;friendNote('Solo · nenhuma conexão necessária');if(old)net('leave',old).catch(()=>{});return}if(op==='invite'){if(!room){friendNote('Crie uma sala primeiro.');return}try{await navigator.clipboard.writeText(room.code);friendNote('Código copiado: '+room.code)}catch{friendNote('Código: '+room.code)}return}if(op==='reset'&&confirm('Apagar toda a coleção e o progresso neste aparelho?')){localStorage.removeItem(KEY);location.reload()}});
if(saved?.party?.length)begin(saved.party[0].id,saved);else starter();
// The small built-in catalog works immediately. Full server catalog is loaded in the background.
fetch('/dex').then(r=>r.ok?r.json():null).then(d=>{if(d?.dex){E.addDex(d.dex);if(game){game.player.hp=Math.min(game.maxHp(),game.player.hp);for(let i=0;i<6;i++)game.spawn(i)}}if(game)hud(true)}).catch(()=>{});
